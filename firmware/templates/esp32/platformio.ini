; Firmware baseline only: ESP32-S3-DevKitC-1-N8, 8 MB flash, no PSRAM.
; This is NOT an N16R8 configuration or a carrier/socket pin assignment.
; Review exact hardware and memory configuration before flashing.
[platformio]
src_dir = esp32
default_envs = esp32

[env:esp32]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
build_flags = -I app/include -I bsp/include -I bsp/esp32
build_src_filter = +<*> +<../app/src/> +<../bsp/esp32/>
monitor_speed = 115200
