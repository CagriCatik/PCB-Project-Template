; PlatformIO project for the Arduino Uno Rev3 shield template.
; Run from this directory:  pio run -e uno     (host tests: scripts/kit firmware <project> --target host)

[platformio]
src_dir = arduino
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -I app/include -I bsp/include
build_src_filter = +<*> +<../app/src/> +<../bsp/arduino/>
